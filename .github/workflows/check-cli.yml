name: Check CLI

on:
  pull_request:
    paths:
      - ".github/workflows/check-cli.yml"
      - ".github/workflows/release-cli.yml"
      - "packages/core/**"
      - "packages/llm/**"
      - "packages/schema/**"
      - "packages/protocol/**"
      - "packages/plugin/**"
      - "packages/sdk/**"
      - "packages/server/**"
      - "packages/client/**"
      - "packages/ui/**"
      - "packages/core-script/**"
      - "packages/http-recorder/**"
      - "packages/httpapi-codegen/**"
      - "packages/effect-*/**"
      - "bun.lock"
      - "package.json"
      - "install.sh"
      - "install.ps1"
      - "packages/agent/**"
      - "packages/script/**"
      - "packages/tui/**"
      - "packages/codemode/**"
      - "tools/build-cli.sh"
      - "tools/check-cli.sh"
      - "tools/install-cli.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-cli.yml"
      - ".github/workflows/release-cli.yml"
      - "packages/core/**"
      - "packages/llm/**"
      - "packages/schema/**"
      - "packages/protocol/**"
      - "packages/plugin/**"
      - "packages/sdk/**"
      - "packages/server/**"
      - "packages/client/**"
      - "packages/ui/**"
      - "packages/core-script/**"
      - "packages/http-recorder/**"
      - "packages/httpapi-codegen/**"
      - "packages/effect-*/**"
      - "bun.lock"
      - "package.json"
      - "install.sh"
      - "install.ps1"
      - "packages/agent/**"
      - "packages/script/**"
      - "packages/tui/**"
      - "packages/codemode/**"
      - "tools/build-cli.sh"
      - "tools/check-cli.sh"
      - "tools/install-cli.sh"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source/swiftcoder
    steps:
      - name: Check out SwiftCoder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source/swiftcoder
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Check CLI
        run: bun run cli:check
