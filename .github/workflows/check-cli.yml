name: Check CLI

on:
  pull_request:
    paths:
      - ".github/workflows/check-cli.yml"
      - ".github/workflows/release-cli.yml"
      - ".swiftcore-ref"
      - "bun.lock"
      - "package.json"
      - "install.sh"
      - "install.ps1"
      - "packages/opencode/**"
      - "packages/script/**"
      - "packages/tui/**"
      - "packages/codemode/**"
      - "tools/build-cli.sh"
      - "tools/check-cli.sh"
      - "tools/install-cli.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-cli.yml"
      - ".github/workflows/release-cli.yml"
      - ".swiftcore-ref"
      - "bun.lock"
      - "package.json"
      - "install.sh"
      - "install.ps1"
      - "packages/opencode/**"
      - "packages/script/**"
      - "packages/tui/**"
      - "packages/codemode/**"
      - "tools/build-cli.sh"
      - "tools/check-cli.sh"
      - "tools/install-cli.sh"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source/swiftcoder
    steps:
      - name: Check out SwiftCoder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source/swiftcoder
      - name: Read pinned SwiftCore revision
        id: swiftcore
        run: |
          set -euo pipefail
          ref="$(tr -d '[:space:]' < .swiftcore-ref)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Check out pinned SwiftCore
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: swift-scale-ai/swiftcore
          ref: ${{ steps.swiftcore.outputs.ref }}
          path: source/swiftcore
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Link shared dependency tree
        run: |
          test ! -e ../node_modules
          ln -s swiftcoder/node_modules ../node_modules
      - name: Check CLI
        run: bun run cli:check
