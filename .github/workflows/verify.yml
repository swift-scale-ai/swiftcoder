name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-and-dependencies:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source/swiftcoder
    steps:
      - name: Check out SwiftCoder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source/swiftcoder

      - name: Read pinned SwiftCore revision
        id: swiftcore
        run: |
          set -euo pipefail
          ref="$(tr -d '[:space:]' < .swiftcore-ref)"
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo ".swiftcore-ref must contain one full 40-character Git commit SHA" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out pinned SwiftCore
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: swift-scale-ai/swiftcore
          ref: ${{ steps.swiftcore.outputs.ref }}
          path: source/swiftcore

      - name: Verify SwiftCore revision and sibling layout
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < .swiftcore-ref)"
          actual="$(git -C ../swiftcore rev-parse HEAD)"
          test "$actual" = "$expected"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Link shared dependency tree
        run: |
          test ! -e ../node_modules
          ln -s swiftcoder/node_modules ../node_modules
      - run: bun run typecheck
      - run: bun run check:open-source
      - run: bun run check:security
