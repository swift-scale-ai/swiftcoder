name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build signed macOS release
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        working-directory: source/swiftcoder

    steps:
      - name: Check out SwiftCoder release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: source/swiftcoder

      - name: Read pinned SwiftCore revision
        id: swiftcore
        run: |
          set -euo pipefail
          ref="$(tr -d '[:space:]' < .swiftcore-ref)"
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo ".swiftcore-ref must contain one full 40-character Git commit SHA" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out pinned SwiftCore
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: swift-scale-ai/swiftcore
          ref: ${{ steps.swiftcore.outputs.ref }}
          path: source/swiftcore

      - name: Verify SwiftCore revision and sibling layout
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < .swiftcore-ref)"
          actual="$(git -C ../swiftcore rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Prepare release credentials
        env:
          CSC_LINK_BASE64: ${{ secrets.CSC_LINK_BASE64 }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          if [[ -z "$CSC_LINK_BASE64" ]]; then
            echo "Missing GitHub Actions secret: CSC_LINK_BASE64" >&2
            exit 1
          fi
          if [[ -z "$APPLE_API_KEY_BASE64" ]]; then
            echo "Missing GitHub Actions secret: APPLE_API_KEY_BASE64" >&2
            exit 1
          fi
          if [[ -z "$APPLE_API_KEY_ID" ]]; then
            echo "Missing GitHub Actions secret: APPLE_API_KEY_ID" >&2
            exit 1
          fi
          if [[ -z "$APPLE_API_ISSUER" ]]; then
            echo "Missing GitHub Actions secret: APPLE_API_ISSUER" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use a semantic version such as v0.2.1 or v0.2.1-beta.1" >&2
            exit 1
          fi

          channel="prod"
          if [[ "$version" == *-* ]]; then
            channel="beta"
          fi

          signing_dir="$RUNNER_TEMP/swiftcoder-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$CSC_LINK_BASE64" | /usr/bin/base64 -D > "$signing_dir/swiftcoder-developer-id.p12"
          printf '%s' "$APPLE_API_KEY_BASE64" | /usr/bin/base64 -D > "$signing_dir/AuthKey.p8"
          chmod 600 "$signing_dir/swiftcoder-developer-id.p12" "$signing_dir/AuthKey.p8"

          # The release script requires a config file. CI credentials remain in
          # GitHub Secrets and the runner environment, not in this file.
          : > "$RUNNER_TEMP/swiftcoder-release.env"

          {
            echo "SWIFTCODER_RELEASE_ENV=$RUNNER_TEMP/swiftcoder-release.env"
            echo "SWIFTCODER_VERSION=$version"
            echo "SWIFTCODER_BUILD_VERSION=$GITHUB_RUN_NUMBER"
            echo "SWIFTCODER_CHANNEL=$channel"
            echo "CSC_LINK=$signing_dir/swiftcoder-developer-id.p12"
            echo "APPLE_API_KEY=$signing_dir/AuthKey.p8"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Link shared dependency tree
        run: |
          test ! -e ../node_modules
          ln -s swiftcoder/node_modules ../node_modules

      - name: Build, sign, notarize, and verify
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./tools/package-mac-release.sh "$SWIFTCODER_CHANNEL"

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(packages/desktop/dist/*.dmg packages/desktop/dist/*.zip)

          if (( ${#assets[@]} != 2 )); then
            echo "Expected exactly one DMG and one ZIP, found ${#assets[@]} artifacts" >&2
            printf '  %s\n' "${assets[@]}" >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            exit 0
          fi

          release_args=(--verify-tag --generate-notes --title "SwiftCoder $SWIFTCODER_VERSION")
          if [[ "$SWIFTCODER_CHANNEL" == "beta" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${release_args[@]}"
