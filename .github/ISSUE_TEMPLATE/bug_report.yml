name: Bug report
description: Report a reproducible SwiftCoder defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private source code, or customer data. Report security vulnerabilities privately according to SECURITY.md.
  - type: input
    id: version
    attributes:
      label: SwiftCoder version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
